<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cut">
<title>10분닷컴 오늘의 10분</title>
<meta name="description" content="매일 0시에 바뀌는 10분짜리 작은 즐거움. 정확히 10초, 오늘의 색, 모두의 어항 등 20가지 데일리.">
<meta name="theme-color" content="#E6E3F1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6E3F1; --bg2:#DAD6EA; --paper:#FCFBFF; --ink:#231D4B; --ink2:#5A5486; --ink3:#8F8AB0; --line:#CBC6E0;
  --red:#FF5E5B; --red-d:#D23F48;
  --blue:#4B5BFF; --blue-d:#3140CF;
  --yellow:#FFD13D; --yellow-d:#D8A40C;
  --pink:#FF8BC6; --pink-d:#D85C9E;
  --mint:#2DCEA2; --mint-d:#139E79;
  --violet:#8C6BFF; --violet-d:#6646D6;
  --orange:#FF9A3D; --orange-d:#D6731A;
  --water1:#7FD3FF; --water2:#2A55C9;
  --r-xl:34px; --r-lg:24px; --r-md:16px; --r-sm:10px;
  --f-disp:"Do Hyeon","IBM Plex Sans KR",sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background-color:var(--bg);color:var(--ink);font-family:var(--f-body);
  font-size:16px;line-height:1.6;font-feature-settings:"tnum" 1;
  background-image:radial-gradient(circle at center, rgba(35,29,75,.11) 1.6px, transparent 1.9px);
  background-size:24px 24px;background-position:12px 12px;
  min-height:100vh;
}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
@media (max-width:640px){.wrap{padding:0 16px}}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:40;background:rgba(230,227,241,.82);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(35,29,75,.08)}
.top .wrap{display:flex;align-items:center;gap:20px;height:68px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo svg{width:38px;height:38px;flex:none}
.logo b{font-family:var(--f-disp);font-weight:400;font-size:28px;letter-spacing:-.5px;line-height:1}
.logo div{display:flex;flex-direction:column;gap:3px}.logo span{font-size:12px;color:var(--ink2);line-height:1.2}
.top-date{margin-left:auto;font-size:14px;color:var(--ink2)}
.top-date strong{color:var(--ink);font-weight:600}
.streak{display:flex;align-items:center;gap:6px;background:var(--paper);border-radius:999px;padding:6px 12px 6px 8px;font-size:13px;font-weight:600;box-shadow:0 2px 0 var(--line)}
.streak i{width:22px;height:22px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;font-style:normal;font-size:12px;box-shadow:inset 0 -2px 0 var(--yellow-d)}
@media (max-width:640px){.top-date{display:none}.logo span{display:none}.streak{margin-left:auto}}

/* ---------- buttons ---------- */
.btn{
  --c:var(--ink);--cd:#120e2e;--t:#fff;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-family:var(--f-disp);font-size:20px;line-height:1;letter-spacing:.2px;
  background:var(--c);color:var(--t);border:0;border-radius:999px;padding:16px 28px 15px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.22),0 5px 0 var(--cd);cursor:pointer;text-decoration:none;
  transition:transform .08s ease, box-shadow .08s ease, filter .15s;user-select:none;-webkit-tap-highlight-color:transparent;
}
.btn:hover{filter:brightness(1.06)}
.btn:active,.btn.pressed{transform:translateY(4px);box-shadow:inset 0 2px 0 rgba(255,255,255,.22),0 1px 0 var(--cd)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.sm{font-size:16px;padding:11px 18px 10px;box-shadow:inset 0 2px 0 rgba(255,255,255,.22),0 3px 0 var(--cd)}
.btn.sm:active{transform:translateY(2px);box-shadow:0 1px 0 var(--cd)}
.btn.xl{font-size:28px;padding:22px 44px 20px}
.btn.ghost{--c:var(--paper);--cd:var(--line);--t:var(--ink)}
.btn.red{--c:var(--red);--cd:var(--red-d)}
.btn.blue{--c:var(--blue);--cd:var(--blue-d)}
.btn.yellow{--c:var(--yellow);--cd:var(--yellow-d);--t:var(--ink)}
.btn.pink{--c:var(--pink);--cd:var(--pink-d);--t:var(--ink)}
.btn.mint{--c:var(--mint);--cd:var(--mint-d);--t:var(--ink)}
.btn.violet{--c:var(--violet);--cd:var(--violet-d)}
.btn.orange{--c:var(--orange);--cd:var(--orange-d);--t:var(--ink)}
.linkbtn{background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;color:var(--ink2);font-size:14px}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr) minmax(0,.78fr);gap:28px;padding-top:44px;padding-bottom:26px;align-items:center}
@media (max-width:1080px){.hero{grid-template-columns:1fr 1fr}.live{grid-column:1/-1}}
@media (max-width:720px){.hero{grid-template-columns:1fr;padding-top:24px}.timer{max-width:330px}}
.timer{position:relative;aspect-ratio:1;max-width:470px;width:100%;justify-self:center}
.timer-body{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 34% 28%, #FF8B86 0%, var(--red) 46%, #E9474B 100%);box-shadow:inset 0 10px 18px rgba(255,255,255,.35), inset 0 -18px 30px rgba(120,10,30,.25), 0 14px 0 var(--red-d), 0 26px 40px rgba(60,20,80,.22)}
.timer-face{position:absolute;inset:9%;border-radius:50%;background:var(--paper);box-shadow:inset 0 6px 14px rgba(35,29,75,.16)}
.timer svg.dial{position:absolute;inset:9%;width:82%;height:82%;overflow:visible}
.timer .seg{cursor:pointer;transition:opacity .2s, stroke-width .2s}
.timer .seg:hover{stroke-width:46}
.timer .seg.done{opacity:.28}
.timer-knob{position:absolute;left:50%;top:50%;width:36%;height:36%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 40% 32%,#fff,#EEECF7 60%,#D9D5EA);box-shadow:0 8px 0 #BDB7D6,0 12px 24px rgba(35,29,75,.18), inset 0 -3px 0 rgba(35,29,75,.06);display:grid;place-items:center;text-align:center}
.timer-knob .t{font-family:var(--f-disp);font-size:clamp(30px,5.4vw,54px);line-height:1;letter-spacing:-1px}
.timer-knob .s{font-size:13px;color:var(--ink2);margin-top:4px}
.timer-ear{position:absolute;top:-4%;left:50%;width:22%;height:12%;transform:translateX(-50%);background:var(--red);border-radius:16px 16px 6px 6px;box-shadow:inset 0 4px 0 rgba(255,255,255,.3),0 6px 0 var(--red-d);z-index:-1}
.hero-copy h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(44px,6vw,76px);line-height:1;margin:0 0 14px;letter-spacing:-1.5px}
.hero-copy > p{margin:0 0 22px;color:var(--ink2);font-size:17px;max-width:30em}
.set-list{list-style:none;margin:0 0 24px;padding:0;display:grid;gap:10px}
.set-list a{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:12px;background:var(--paper);border-radius:var(--r-md);padding:12px 16px 12px 12px;text-decoration:none;box-shadow:0 3px 0 var(--line);transition:transform .12s}
.set-list a:hover{transform:translateX(4px)}
.set-list .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-disp);font-size:16px;color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.set-list .nm{font-weight:600;line-height:1.3}
.set-list .nm small{display:block;font-weight:400;font-size:13px;color:var(--ink2)}
.set-list .st{font-size:13px;color:var(--ink3)}
.set-list li.done .st{color:var(--mint-d);font-weight:700}
.set-list li.done .nm{text-decoration:line-through;text-decoration-color:var(--ink3)}

.live{background:var(--ink);color:#fff;border-radius:var(--r-xl);padding:22px 22px 18px;box-shadow:0 8px 0 #120e2e;position:relative;overflow:hidden}
.live h2{font-family:var(--f-disp);font-weight:400;font-size:24px;margin:0 0 4px}
.live > p{margin:0 0 14px;font-size:13px;color:#B9B4DC}
.live-item{display:block;text-decoration:none;border-top:1px solid rgba(255,255,255,.12);padding:13px 0}
.live-item .k{font-size:13px;color:#B9B4DC;display:flex;align-items:center;gap:8px}
.live-item .k i{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 0 rgba(45,206,162,.6);animation:ping 2s infinite}
.live-item .v{font-family:var(--f-disp);font-size:24px;line-height:1.2;margin-top:2px}
.live-item:hover .v{color:var(--yellow)}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(45,206,162,.55)}70%{box-shadow:0 0 0 8px rgba(45,206,162,0)}100%{box-shadow:0 0 0 0 rgba(45,206,162,0)}}

/* ---------- filter ---------- */
.shelf-bar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:44px 0 18px;flex-wrap:wrap}
.shelf-bar h2{font-family:var(--f-disp);font-weight:400;font-size:clamp(30px,4vw,44px);line-height:1.05;margin:0}
.shelf-bar p{margin:6px 0 0;color:var(--ink2)}
.toggle{display:inline-flex;background:var(--paper);border-radius:999px;padding:5px;box-shadow:0 3px 0 var(--line)}
.toggle button{border:0;background:none;border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink2)}
.toggle button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* ---------- gadget cards ---------- */
.shelf{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:22px}
.gadget{--c:var(--red);--cd:var(--red-d);grid-column:span var(--span,4);display:flex;flex-direction:column;background:var(--paper);border-radius:var(--r-lg);text-decoration:none;box-shadow:0 5px 0 var(--line);overflow:hidden;transition:transform .16s ease, box-shadow .16s ease;position:relative}
.gadget:hover{transform:translateY(-4px);box-shadow:0 9px 0 var(--line)}
.gadget:active{transform:translateY(1px);box-shadow:0 3px 0 var(--line)}
.gadget .face{position:relative;background:var(--c);min-height:168px;display:grid;place-items:center;padding:26px 18px 18px;overflow:hidden;box-shadow:inset 0 -5px 0 var(--cd), inset 0 4px 0 rgba(255,255,255,.25)}
.gadget .face::before{content:"";position:absolute;top:10px;left:50%;width:30px;height:10px;transform:translateX(-50%);border-radius:999px;background:var(--bg);box-shadow:inset 0 2px 2px rgba(35,29,75,.25)}
.gadget .meta{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.gadget .no{font-size:12px;color:var(--ink3);font-weight:600}
.gadget h3{font-family:var(--f-disp);font-weight:400;font-size:24px;line-height:1.15;margin:0}
.gadget p{margin:0;color:var(--ink2);font-size:14px;line-height:1.5}
.gadget .foot{margin-top:auto;padding-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--bg);color:var(--ink2);white-space:nowrap}
.chip.srv{background:var(--ink);color:#fff}
.chip.tm::before{content:"";width:10px;height:10px;border-radius:50%;border:2px solid currentColor;box-sizing:border-box;background:conic-gradient(currentColor 0 25%,transparent 0)}
.gadget.hide{display:none}
@media (max-width:1000px){.gadget{grid-column:span 6 !important}}
@media (max-width:620px){.shelf{gap:16px}.gadget{grid-column:span 12 !important}}

.g-red{--c:var(--red);--cd:var(--red-d)}
.g-blue{--c:var(--blue);--cd:var(--blue-d)}
.g-yellow{--c:var(--yellow);--cd:var(--yellow-d)}
.g-pink{--c:var(--pink);--cd:var(--pink-d)}
.g-mint{--c:var(--mint);--cd:var(--mint-d)}
.g-violet{--c:var(--violet);--cd:var(--violet-d)}
.g-orange{--c:var(--orange);--cd:var(--orange-d)}

/* thumbs */
.th{color:#fff;text-align:center;font-family:var(--f-disp);width:100%}
.th-dark{color:var(--ink)}
.th-big{font-size:64px;line-height:.9;letter-spacing:-2px}
.th-big small{font-size:22px;margin-left:4px;letter-spacing:0}
.th-ruler{height:16px;margin:12px auto 0;max-width:260px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.85) 0 2px,transparent 2px 13px);mask:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent)}
.th-sw{display:flex;gap:8px;justify-content:center}
.th-sw i{width:38px;height:58px;border-radius:12px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15),0 3px 0 rgba(0,0,0,.12)}
.th-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.th-tile{width:44px;height:44px;border-radius:50%;background:var(--paper);color:var(--ink);display:grid;place-items:center;font-size:20px;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.th small.cap{display:block;font-family:var(--f-body);font-size:12px;opacity:.85;margin-top:8px}

/* ---------- detail ---------- */
.detail{padding-top:28px;padding-bottom:60px}
.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-size:14px;font-weight:600;color:var(--ink2);background:var(--paper);padding:8px 14px 8px 10px;border-radius:999px;box-shadow:0 2px 0 var(--line)}
.back svg{width:16px;height:16px}
.d-head{display:grid;grid-template-columns:auto 1fr;gap:6px 22px;align-items:end;margin:22px 0 24px}
.d-badge{grid-row:span 2;width:92px;height:92px;border-radius:28px;background:var(--c);display:grid;place-items:center;font-family:var(--f-disp);font-size:40px;color:#fff;box-shadow:inset 0 3px 0 rgba(255,255,255,.3),0 6px 0 var(--cd)}
.g-yellow .d-badge,.g-mint .d-badge,.g-pink .d-badge,.g-orange .d-badge{color:var(--ink)}
.d-head h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(34px,5vw,58px);line-height:1.02;margin:0;letter-spacing:-1px}
.d-head p{margin:0;color:var(--ink2);font-size:17px}
.d-facts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;grid-column:2}
@media (max-width:640px){.d-head{grid-template-columns:1fr}.d-badge{width:64px;height:64px;font-size:28px;border-radius:20px;grid-row:auto}.d-facts{grid-column:1}}
.d-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,.9fr);gap:28px;align-items:start}
@media (max-width:980px){.d-grid{grid-template-columns:1fr}}

.machine{background:var(--c);border-radius:var(--r-xl);padding:18px;box-shadow:inset 0 4px 0 rgba(255,255,255,.28), inset 0 -6px 0 var(--cd), 0 10px 0 var(--cd), 0 22px 40px rgba(35,29,75,.16);position:relative}
.machine::before,.machine::after{content:"";position:absolute;top:8px;width:9px;height:9px;border-radius:50%;background:rgba(0,0,0,.18);box-shadow:inset 0 1px 1px rgba(0,0,0,.3)}
.machine::before{left:16px}.machine::after{right:16px}
.screen{background:var(--paper);border-radius:22px;min-height:440px;padding:28px;position:relative;overflow:hidden;box-shadow:inset 0 3px 10px rgba(35,29,75,.12)}
@media (max-width:640px){.machine{padding:10px;border-radius:26px}.screen{padding:18px 16px;border-radius:18px}}
.ad-slot{margin-top:40px;border:2px dashed var(--ink3);border-radius:var(--r-md);min-height:110px;display:grid;place-items:center;text-align:center;padding:14px;color:var(--ink2);font-size:13px;background:rgba(252,251,255,.5)}
.ad-slot b{display:block;font-size:14px;color:var(--ink)}
.ad-none{margin-top:24px;font-size:13px;color:var(--ink2);display:flex;gap:8px;align-items:center}
.ad-none::before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid var(--ink3);background:linear-gradient(45deg,transparent 45%,var(--ink3) 45% 55%,transparent 55%)}

.manual{background:var(--paper);border-radius:6px 6px 26px 6px;padding:26px 26px 22px;box-shadow:0 5px 0 var(--line), 0 18px 30px rgba(35,29,75,.08);position:relative}
.manual::after{content:"";position:absolute;right:0;top:0;width:34px;height:34px;background:linear-gradient(225deg,var(--bg) 50%,#ECE9F6 50%);border-bottom-left-radius:8px;box-shadow:-2px 2px 3px rgba(35,29,75,.1)}
.manual h2{font-family:var(--f-disp);font-weight:400;font-size:26px;margin:0 0 4px}
.manual > p{margin:0 0 14px;color:var(--ink2);font-size:14px}
.manual dl{margin:0}
.manual dt{font-weight:700;font-size:14px;margin-top:16px;display:flex;align-items:center;gap:8px}
.manual dt::before{content:"";width:12px;height:12px;border-radius:4px;background:var(--c);box-shadow:inset 0 -2px 0 var(--cd)}
.manual dd{margin:4px 0 0 20px;font-size:14.5px;line-height:1.65;color:#3B3566}
.manual .share-ex{margin-top:18px;background:var(--bg);border-radius:var(--r-sm);padding:12px 14px;font-size:13.5px;white-space:pre-line;line-height:1.55}
.manual .share-ex b{display:block;font-size:12px;color:var(--ink2);margin-bottom:4px}

.pager{display:flex;justify-content:space-between;gap:16px;margin-top:48px;flex-wrap:wrap}
.pager a{flex:1;min-width:220px;background:var(--paper);border-radius:var(--r-md);padding:16px 18px;text-decoration:none;box-shadow:0 4px 0 var(--line)}
.pager a small{display:block;color:var(--ink2);font-size:13px}
.pager a b{font-family:var(--f-disp);font-weight:400;font-size:22px}
.pager a.next{text-align:right}

/* ---------- shared game bits ---------- */
.g-center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.lbl{font-size:14px;color:var(--ink2)}
.hint{font-size:13.5px;color:var(--ink2);margin:0;max-width:34em}
.mock{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:#FFF3C4;color:#7A5A00;border-radius:999px;padding:4px 10px}
.mock::before{content:"";width:7px;height:7px;border-radius:50%;background:#E0A800}
.bignum{font-family:var(--f-disp);font-size:clamp(64px,12vw,120px);line-height:.95;letter-spacing:-3px}
.bignum small{font-size:.3em;letter-spacing:0;margin-left:6px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.c{justify-content:center}
.spacer{height:10px}
.panel{background:var(--bg);border-radius:var(--r-md);padding:16px 18px}
.panel h4{margin:0 0 8px;font-size:15px}
.result{width:100%;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.squares{display:flex;gap:6px;justify-content:center}
.squares i{width:30px;height:30px;border-radius:8px;background:var(--bg2);box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.squares i.on{background:var(--mint);box-shadow:inset 0 -3px 0 var(--mint-d)}
.squares i.mid{background:var(--yellow);box-shadow:inset 0 -3px 0 var(--yellow-d)}
.seg-tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.seg-tabs button{border:0;background:var(--bg);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink2)}
.seg-tabs button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg-tabs button small{font-weight:400;opacity:.75;margin-left:4px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:14px;border-radius:999px;background:var(--track,var(--bg2));box-shadow:inset 0 2px 3px rgba(35,29,75,.18)}
input[type=range]::-moz-range-track{height:14px;border-radius:999px;background:var(--track,var(--bg2))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-8px;border-radius:50%;background:#fff;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--ink)}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.field input,.field select,.inp{font:inherit;font-weight:500;font-size:16px;padding:12px 14px;border-radius:var(--r-sm);border:2px solid var(--line);background:#fff;color:var(--ink);min-width:0}
.field input:focus,.field select:focus,.inp:focus{outline:none;border-color:var(--ink)}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
table.tbl th{text-align:left;font-weight:600;color:var(--ink2);font-size:12.5px;padding:6px 8px;border-bottom:2px solid var(--line)}
table.tbl td{padding:10px 8px;border-bottom:1px solid var(--line)}
table.tbl tr.me td{background:#FFF6CF;font-weight:700}
table.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:12px;border-radius:999px;background:var(--bg2);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:999px;background:var(--c,var(--ink));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:700px){.split{grid-template-columns:1fr}}

/* toast & share */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,40px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:90;box-shadow:0 6px 18px rgba(0,0,0,.25);pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(35,29,75,.55);display:grid;place-items:center;z-index:80;padding:18px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.ticket{width:min(400px,100%);background:var(--paper);border-radius:26px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.ticket-top{background:var(--c,var(--ink));color:#fff;padding:22px 24px 26px;position:relative}
.g-yellow .ticket-top,.g-mint .ticket-top,.g-pink .ticket-top,.g-orange .ticket-top{color:var(--ink)}
.ticket-top::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:18px;background:radial-gradient(circle at 9px 9px,var(--paper) 8px,transparent 8.5px) 0 0/22px 18px repeat-x}
.ticket-top small{font-size:13px;opacity:.85}
.ticket-top h3{font-family:var(--f-disp);font-weight:400;font-size:30px;margin:4px 0 0;line-height:1.1}
.ticket-body{padding:24px}
.ticket-body pre{margin:0 0 16px;font-family:var(--f-body);font-size:16px;line-height:1.6;white-space:pre-wrap;background:var(--bg);border-radius:var(--r-md);padding:16px}
.ticket-body .row{justify-content:space-between}

/* ---------- footer ---------- */
.foot{padding:60px 0 50px;color:var(--ink2);font-size:13px}
.foot .wrap{display:flex;gap:20px;justify-content:space-between;flex-wrap:wrap;border-top:2px solid rgba(35,29,75,.12);padding-top:22px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}}

/* ---------- 전국 순위 (scoreboard) ---------- */
.lb{margin-top:34px;background:var(--ink);color:#fff;border-radius:var(--r-xl);padding:26px 26px 20px;box-shadow:0 10px 0 #120e2e,0 22px 40px rgba(35,29,75,.18);position:relative;overflow:hidden}
.lb::before{content:"";position:absolute;left:26px;right:26px;top:11px;height:6px;background:radial-gradient(circle,rgba(255,209,61,.9) 2px,transparent 2.6px) 0 0/14px 6px repeat-x;opacity:.5}
.lb-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.lb h2{font-family:var(--f-disp);font-weight:400;font-size:30px;margin:0;line-height:1.1}
.lb-top p{margin:2px 0 0;color:#B9B4DC;font-size:13px}
.lb-live{display:flex;align-items:center;gap:8px;font-size:14px;color:#D8D4F2;flex-wrap:wrap}
.lb-live b{color:#fff}
.lb-live > i{width:8px;height:8px;border-radius:50%;background:var(--mint);animation:ping 2s infinite}
.lb-who{margin-top:12px;font-size:14px;color:#D8D4F2;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lb-who b{color:#fff}
.lb-who .linkbtn{color:var(--yellow)}
.lb-edit{display:flex;gap:8px;flex-wrap:wrap}
.lb-edit .inp{padding:8px 10px;font-size:15px;border-color:transparent;width:auto}
.lb-me{margin-top:14px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center;background:rgba(255,255,255,.07);border-radius:20px;padding:16px 20px}
.lb-me.lock .lb-rank b{color:#5A5486}
.lb-rank{min-width:96px}
.lb-rank small{display:block;font-size:12px;color:#B9B4DC}
.lb-rank b{font-family:var(--f-disp);font-weight:400;font-size:64px;line-height:.95;color:var(--yellow);letter-spacing:-1px;display:inline-block}
.lb-rank em{font-style:normal;font-family:var(--f-disp);font-size:22px;margin-left:3px}
.lb-rank.flash b{animation:rkflash 1s cubic-bezier(.2,1.4,.4,1)}
@keyframes rkflash{0%{transform:scale(1.25);color:#fff}100%{transform:none}}
.lb-best{font-size:15px}
.lb-best b{color:var(--yellow);font-weight:700}
.lb-goals{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.lb-goals span{background:rgba(255,255,255,.1);border-radius:999px;padding:5px 12px;font-size:13px}
.lb-goals b{color:var(--yellow)}
.lb-note{font-size:13px;color:#B9B4DC;max-width:15em;display:block;text-align:right}
.lb-ladder{margin:18px 10px 4px;position:relative;height:46px}
.lb-ladder .track{position:absolute;left:0;right:0;top:12px;height:6px;border-radius:9px;background:linear-gradient(90deg,rgba(255,255,255,.12),rgba(255,209,61,.85))}
.lb-ladder .mk{position:absolute;top:24px;transform:translateX(-50%);font-size:11px;color:#8F8AB0;white-space:nowrap}
.lb-ladder .mk::before{content:"";position:absolute;left:50%;top:-14px;width:2px;height:10px;background:rgba(255,255,255,.3)}
.lb-ladder .mk:last-of-type{transform:none}
.lb-ladder .dot{position:absolute;top:0;width:30px;height:30px;transform:translateX(-50%);border-radius:50%;background:var(--yellow);color:var(--ink);font-size:12px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 5px rgba(255,209,61,.22);transition:left .7s cubic-bezier(.2,.8,.2,1)}
.lb .seg-tabs{justify-content:flex-start;margin-top:14px}
.lb .seg-tabs button{background:rgba(255,255,255,.08);color:#D8D4F2}
.lb .seg-tabs button[aria-pressed="true"]{background:var(--yellow);color:var(--ink)}
.lb-list{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:4px}
.lb-list li{display:grid;grid-template-columns:52px minmax(0,1fr) 64px auto;gap:10px;align-items:center;padding:8px 14px;border-radius:12px;background:rgba(255,255,255,.04);font-size:14.5px}
.lb-list .n{font-family:var(--f-disp);font-size:20px;color:#8F8AB0}
.lb-list .nk{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-list .rg{font-size:12.5px;color:#B9B4DC}
.lb-list .v{font-family:var(--f-disp);font-size:19px;text-align:right}
.lb-list li.g1 .n{color:var(--yellow)}.lb-list li.g2 .n{color:#E6E3F1}.lb-list li.g3 .n{color:var(--orange)}
.lb-list li.g1{background:rgba(255,209,61,.12)}
.lb-list li.me{background:var(--yellow);color:var(--ink);font-weight:700}
.lb-list li.me .n,.lb-list li.me .rg{color:var(--ink)}
.lb-list li.gap{background:none;display:block;text-align:center;color:#5A5486;padding:0;line-height:1}
.lb-list li.empty{display:block;color:#B9B4DC;text-align:center;padding:20px}
.lb-list li.rgrow{grid-template-columns:52px 64px minmax(0,1fr) auto}
.lb-list .bar{height:10px;background:rgba(255,255,255,.08)}
.lb-list .bar i{background:#8F8AB0}
.lb-list li.me .bar{background:rgba(35,29,75,.15)}.lb-list li.me .bar i{background:var(--ink)}
.lb-foot{margin:10px 0 0;font-size:12.5px;color:#8F8AB0}
.tks{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center}
.tk{width:24px;height:10px;border-radius:9px;background:var(--red);box-shadow:inset 0 -2px 0 var(--red-d)}
.tk.used{background:var(--bg2);box-shadow:none}
.rankline{margin:8px 0 0;font-weight:700;font-size:16px}
.rankline b{background:var(--yellow);border-radius:8px;padding:1px 8px}
.dist{display:grid;gap:4px;margin:10px auto 4px;max-width:340px;text-align:left;font-size:13px}
.dist div{display:grid;grid-template-columns:22px 1fr 40px;gap:8px;align-items:center}
.dist i{display:block;height:14px;border-radius:5px;background:var(--bg2)}
.dist .on i{background:var(--blue)}
@media (max-width:640px){
 .lb{padding:22px 16px 16px;border-radius:26px}
 .lb-me{grid-template-columns:auto minmax(0,1fr);gap:14px;padding:14px}
 .lb-act{grid-column:1/-1}.lb-note{text-align:left;max-width:none}
 .lb-rank{min-width:0}.lb-rank b{font-size:50px}
 .lb-list li{grid-template-columns:40px minmax(0,1fr) auto;padding:8px 10px}
 .lb-list .rg{display:none}
 .lb-list li.rgrow{grid-template-columns:30px 44px minmax(0,1fr) auto}
}

.champs{margin-top:30px;background:var(--ink);color:#fff;border-radius:var(--r-xl);padding:24px 24px 22px;box-shadow:0 8px 0 #120e2e;position:relative;overflow:hidden}
.champs::before{content:"";position:absolute;left:24px;right:24px;top:10px;height:6px;background:radial-gradient(circle,rgba(255,209,61,.9) 2px,transparent 2.6px) 0 0/14px 6px repeat-x;opacity:.5}
.champs-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-top:4px}
.champs h2{font-family:var(--f-disp);font-weight:400;font-size:clamp(28px,3.4vw,38px);margin:0;line-height:1.05}
.champs-head p{margin:4px 0 0;color:#B9B4DC;font-size:14px}
.champs-reset{font-size:14px;color:#D8D4F2}
.champs-reset b{font-family:var(--f-disp);font-weight:400;font-size:28px;color:var(--yellow);margin-left:6px;letter-spacing:.5px}
.champs-grid{margin-top:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.champ{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;text-decoration:none;background:rgba(255,255,255,.06);border-radius:18px;padding:14px 16px;transition:background .15s,transform .15s}
.champ:hover{background:rgba(255,255,255,.12);transform:translateY(-2px)}
.champ .cn{grid-row:span 4;width:42px;height:42px;border-radius:13px;background:var(--c);display:grid;place-items:center;font-family:var(--f-disp);font-size:20px;color:#fff;box-shadow:inset 0 -3px 0 var(--cd)}
.champ.g-yellow .cn,.champ.g-orange .cn,.champ.g-mint .cn,.champ.g-pink .cn{color:var(--ink)}

.lb-list .nk .tt{font-size:11.5px;color:#8F8AB0;margin-left:8px;font-weight:400}
.lb-list li.g1 .nk .tt{color:#D8C98A}

<body>
<header class="top"><div class="wrap">
  <a class="logo" href="#/" aria-label="10분닷컴 홈"><div><b>10분</b><span>작은 즐거움, 매일 0시</span></div></a>
  <div class="top-date" id="topDate"></div>
  <div class="streak" title="연속 방문"><i>7</i>7일째 연속</div>
</div></header>
<main id="app"></main>
<footer class="foot"><div class="wrap"><span>10분닷컴 서비스 목업. 전국 순위와 서버형 서비스(11~20번)의 다른 참여자와 수치는 가상 시뮬레이션입니다.</span><span>광고 자리는 점선 상자로 표시했습니다.</span></div></footer>
<script>
'use strict';
/* ===== helpers ===== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const store={
  get(k,d){try{const v=localStorage.getItem('10bun:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('10bun:'+k,JSON.stringify(v))}catch(e){}}
};
const NOW=new Date();
const SEED=NOW.getFullYear()*10000+(NOW.getMonth()+1)*100+NOW.getDate();
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=salt=>rng(SEED*97+salt*7919);
const fmt=n=>Math.round(n).toLocaleString('ko-KR');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pad=n=>String(n).padStart(2,'0');
const DAYS='일월화수목금토';
const DATE_LABEL=`${NOW.getMonth()+1}월 ${NOW.getDate()}일 ${DAYS[NOW.getDay()]}요일`;
const DATE_SHORT=`${NOW.getMonth()+1}/${NOW.getDate()}`;
const REGIONS=['서울','부산','대구','인천','광주','대전','울산','세종','경기','강원','충북','충남','전북','전남','경북','경남','제주'];

let toastT;
function toast(msg){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}
  t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200)}

function share({svc,title,text}){
  const s=SVC(svc);const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="ticket g-${GROUPS[s.g].color}" role="dialog" aria-modal="true" aria-label="결과 공유">
    <div class="ticket-top"><small>10분닷컴 ${DATE_SHORT} ${s.title}</small><h3>${title}</h3></div>
    <div class="ticket-body"><pre>${text}\n10bun.com/${s.slug}</pre>
    <div class="row"><button class="btn ghost sm" data-x>닫기</button><button class="btn sm" data-copy>문구 복사</button></div></div></div>`;
  document.body.appendChild(m);
  const close=()=>m.remove();
  m.addEventListener('click',e=>{if(e.target===m||e.target.closest('[data-x]'))close()});
  $('[data-copy]',m).onclick=async()=>{try{await navigator.clipboard.writeText(text+'\n10bun.com/'+s.slug);toast('복사했어요. 단톡방에 붙여 넣으세요')}catch(e){toast('복사가 막혀 있어요. 문구를 길게 눌러 복사하세요')}};
  $('[data-copy]',m).focus();
  document.addEventListener('keydown',function esc(e){if(e.key==='Escape'){close();document.removeEventListener('keydown',esc)}});
}

/* lifecycle for each detail screen */
let cleanups=[];
const onCleanup=f=>cleanups.push(f);
function runCleanup(){cleanups.forEach(f=>{try{f()}catch(e){}});cleanups=[]}
function every(ms,f){const id=setInterval(f,ms);onCleanup(()=>clearInterval(id));return id}
function after(ms,f){const id=setTimeout(f,ms);onCleanup(()=>clearTimeout(id));return id}
function loop(f){let id,last=performance.now(),dead=false;const go=t=>{if(dead)return;const dt=Math.min(.05,(t-last)/1000);last=t;if(f(dt,t)!==false)id=requestAnimationFrame(go)};id=requestAnimationFrame(go);onCleanup(()=>{dead=true;cancelAnimationFrame(id)})}

/* ===== registry ===== */
const GROUPS={
  A:{name:'감각',color:'red'},B:{name:'추정',color:'blue'},C:{name:'생활',color:'yellow'},D:{name:'친구와',color:'pink'},
  E:{name:'모두의 답',color:'mint'},F:{name:'같이 키우기',color:'violet'},G:{name:'순위와 현황',color:'orange'}
};
const SERVICES=[];
const def=o=>SERVICES.push(o);
const SVC=id=>SERVICES.find(s=>s.id===id);
const TODAY_SET=[1,2,4,7];
const doneKey='done-'+SEED;
const isDone=id=>store.get(doneKey,[]).includes(id);
function markDone(id){const d=store.get(doneKey,[]);if(!d.includes(id)){d.push(id);store.set(doneKey,d)}}

/* ===== hub ===== */
const LOGO=`<svg viewBox="0 0 40 40" aria-hidden="true"><rect x="15" y="1" width="10" height="6" rx="2" fill="#D23F48"/><circle cx="20" cy="22" r="17" fill="#FF5E5B"/><circle cx="20" cy="22" r="12.5" fill="#FCFBFF"/><path d="M20 22 L20 9.5 A12.5 12.5 0 0 1 32.2 19.6 Z" fill="#FFD13D"/><circle cx="20" cy="22" r="3" fill="#231D4B"/></svg>`;

function dialSVG(){
  // 10 min dial: ticks + today's set segments proportional to typical minutes
  const mins={1:1,2:2.5,4:2,7:1.5}; const total=10; let acc=0; let segs='',labels='';
  const cx=200,cy=200,r=158;
  const pt=(a,rr)=>[cx+rr*Math.sin(a),cy-rr*Math.cos(a)];
  TODAY_SET.forEach((id,i)=>{
    const s=SVC(id),m=mins[id];const a0=acc/total*2*Math.PI+0.045,a1=(acc+m)/total*2*Math.PI-0.045;acc+=m;
    const [x0,y0]=pt(a0,r),[x1,y1]=pt(a1,r);const large=a1-a0>Math.PI?1:0;
    const [lx,ly]=pt((a0+a1)/2,r);labels+=`<text x="${lx}" y="${ly+7}" text-anchor="middle" font-family="Do Hyeon" font-size="21" fill="${['yellow','mint','pink','orange'].includes(GROUPS[s.g].color)?'#231D4B':'#fff'}" pointer-events="none">${id}</text>`;
    segs+=`<path class="seg ${isDone(id)?'done':''}" data-go="${id}" d="M${x0} ${y0} A${r} ${r} 0 ${large} 1 ${x1} ${y1}" stroke="var(--${GROUPS[s.g].color})" stroke-width="38" fill="none" stroke-linecap="butt"><title>${s.title}</title></path>`;
  });
  // remaining (free time) arc
  if(acc<total){const a0=acc/total*2*Math.PI+0.03,a1=2*Math.PI-0.03;const [x0,y0]=pt(a0,r),[x1,y1]=pt(a1,r);
    segs+=`<path d="M${x0} ${y0} A${r} ${r} 0 0 1 ${x1} ${y1}" stroke="var(--bg2)" stroke-width="38" fill="none"/>`}
  let ticks='';for(let i=0;i<60;i++){const a=i/60*2*Math.PI,maj=i%6===0;const [x0,y0]=pt(a,maj?122:128),[x1,y1]=pt(a,134);
    ticks+=`<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="#231D4B" stroke-opacity="${maj?.8:.3}" stroke-width="${maj?3.4:1.6}" stroke-linecap="round"/>`}
  let nums='';for(let i=0;i<10;i++){const [x,y]=pt(i/10*2*Math.PI,108);nums+=`<text x="${x}" y="${y+6}" text-anchor="middle" font-family="Do Hyeon" font-size="18" fill="#5A5486">${i}</text>`}
  return `<svg class="dial" viewBox="0 0 400 400" aria-label="오늘의 10분 세트 다이얼">${segs}${labels}${ticks}${nums}</svg>`;
}

function renderHub(){
  const done=TODAY_SET.filter(isDone).length;
  const card=s=>{const g=GROUPS[s.g];return `<a class="gadget g-${g.color}" style="--span:${s.span}" href="#/s/${s.id}" data-side="${s.server?'srv':'solo'}" data-rank="${s.board?1:0}">
      <div class="face">${s.thumb()}</div>
      <div class="meta"><span class="no">${s.id}번, ${g.name}</span><h3>${s.title}</h3><p>${s.line}</p>
      <div class="foot"><span class="chip tm">${s.time}</span>${s.board?'<span class="chip rk">전국 순위</span>':''}${s.server?'<span class="chip srv">서버 집계</span>':''}<span class="chip">${s.shareForm}</span></div></div></a>`};
  $('#app').innerHTML=`
  <section class="wrap hero">
    <div class="timer" id="timer"><div class="timer-ear"></div><div class="timer-body"></div><div class="timer-face"></div>${dialSVG()}
      <div class="timer-knob"><div><div class="t" id="knobT">10:00</div><div class="s">${done}/4 끝냄</div></div></div></div>
    <div class="hero-copy">
      <h1>오늘의 10분</h1>
      <p>${DATE_LABEL}. 매일 0시에 문제가 바뀌어요. 아래 네 개를 끝내면 딱 10분 정도 걸립니다.</p>

function hsb2rgb(h,s,b){s/=100;b/=100;const k=n=>(n+h/60)%6;const f=n=>b*(1-s*Math.max(0,Math.min(k(n),4-k(n),1)));return[f(5)*255,f(3)*255,f(1)*255].map(Math.round)}
function rgb2lab([r,g,b]){[r,g,b]=[r,g,b].map(v=>{v/=255;return v>.04045?Math.pow((v+.055)/1.055,2.4):v/12.92});
  let x=(r*.4124+g*.3576+b*.1805)/.95047,y=r*.2126+g*.7152+b*.0722,z=(r*.0193+g*.1192+b*.9505)/1.08883;
  [x,y,z]=[x,y,z].map(v=>v>.008856?Math.cbrt(v):7.787*v+16/116);return[116*y-16,500*(x-y),200*(y-z)]}
const dE=(a,b)=>{const p=rgb2lab(a),q=rgb2lab(b);return Math.hypot(p[0]-q[0],p[1]-q[1],p[2]-q[2])};
const css=c=>`rgb(${c.join(',')})`;
const COLORS=(()=>{const r=R(2);return Array.from({length:5},()=>({h:Math.round(r()*360),s:Math.round(35+r()*60),b:Math.round(42+r()*55)}))})();

const NICK_B=['수달','판다','펭귄','너구리','다람쥐','부엉이','고래','오리','두더지','고양이','카피바라','미어캣'];
const nickOf=i=>`${NICK_A[i%NICK_A.length]} ${NICK_B[Math.floor(i/NICK_A.length)%NICK_B.length]}`;
function myNick(){let n=store.get('nick',null);if(!n){n=nickOf(Math.floor(Math.random()*144));store.set('nick',n)}return n}
const myReg=()=>store.get('reg','경기');
const REG_W=[.19,.065,.046,.058,.028,.028,.021,.008,.26,.029,.032,.042,.034,.035,.05,.063,.013];
const nz=r=>{let u=0;for(let j=0;j<6;j++)u+=r();return (u-3)/Math.sqrt(.5)};
const pickReg=r=>{let x=r()*REG_W.reduce((a,b)=>a+b,0);for(let k=0;k<REG_W.length;k++){x-=REG_W[k];if(x<=0)return k}return 0};

 5:{n:13050,low:true,tries:1,unit:'시도·시간',gen:(r,b)=>{const p=[.04,.11,.22,.24,.17,.10,.12];let x=r()-b*.03,t=1;for(const q of p){x-=q;if(x<=0)break;t++}return t*1000+clamp(Math.exp(Math.log(70+t*18)+nz(r)*.45),12,999)},round:v=>Math.floor(v/1000)*1000+Math.round(v%1000),

 17:{n:21880,low:true,tries:5,unit:'평균',noRegion:true,gen:(r,b)=>clamp(272+(nz(r)+b*.6)*24,150,450),round:v=>Math.round(v),

Object.entries(BOARDS).forEach(([id,c])=>{const s=SVC(+id);if(!s)return;s.board=c;s.notes.compete=c.compete;s.notes.sample+=`\n전국 ${fmt(Math.round(c.n*.017))}위 / ${fmt(c.n)}명`;s.notes.risk+=' '+c.cheat;s.notes.build+=' '+BUILD_NOTE});

const BD={};
function boardData(id){if(BD[id])return BD[id];const c=BOARDS[id],r=rng(SEED*131+id*977),br=rng(id*31+7);const bias=REGIONS.map(()=>(br()-.5)*.5);
 const n=c.n,t=new Array(n);for(let k=0;k<n;k++){const rg=pickReg(r);t[k]=[c.round(c.gen(r,c.low?-bias[rg]:bias[rg])),rg,Math.floor(r()*144)]}
 t.sort((a,b)=>c.low?a[0]-b[0]:b[0]-a[0]);
 const D={v:Float64Array.from(t,x=>x[0]),rg:Uint8Array.from(t,x=>x[1]),nk:Uint16Array.from(t,x=>x[2])};
 const sum=REGIONS.map(()=>[0,0]);t.forEach(x=>{if(x[0]<7000||!c.low){sum[x[1]][0]+=x[0];sum[x[1]][1]++}});D.reg=sum.map((s,k)=>({n:REGIONS[k],avg:s[0]/Math.max(1,s[1]),cnt:s[1]}));
 return BD[id]=D}
const bdBetter=(c,a,b)=>c.low?a<b:a>b;
function bdAhead(id,v){const c=BOARDS[id],D=boardData(id);let lo=0,hi=D.v.length;while(lo<hi){const m=(lo+hi)>>1;if(!bdBetter(c,v,D.v[m]))lo=m+1;else hi=m}return lo}
const bestOf=id=>store.get(`best-${SEED}-${id}`,null);

let curBoard=null;
function makeBoard(id){
 const c=BOARDS[id],D=boardData(id),kb=`best-${SEED}-${id}`,kt=`try-${SEED}-${id}`;
 let grow=0,bump=0,tab='top',editing=false,flash=false,lastRes=null;
 const used=()=>store.get(kt,0),best=()=>store.get(kb,null);
 const N=()=>D.v.length+grow+(best()!=null?1:0);
 const rankOf=v=>bdAhead(id,v)+1+bump;
 const api={id,cfg:c,onRetry:null,
  left:()=>Math.max(0,c.tries-used()),
  use(){if(api.left()<=0)return false;store.set(kt,used()+1);return true},
  submit(v){v=c.round(v);const prev=best();const prevRank=prev!=null?rankOf(prev):null;const improved=prev==null||bdBetter(c,v,prev);
   if(improved){store.set(kb,v);bump=0}const b=best(),rank=rankOf(b);flash=improved;
   lastRes={rank,N:N(),best:b,v,improved,prevRank:improved?prevRank:null,pct:Math.max(.1,Math.round(rank/N()*1000)/10),left:api.left()};api.render();return lastRes},
  rank:()=>best()!=null?rankOf(best()):null,best,
  shareLine(){const b=best();return b==null?'':`\n전국 ${fmt(rankOf(b))}위 / ${fmt(N())}명`},
  render(){
   const el=$('#board');if(!el)return;const b=best(),rank=b!=null?rankOf(b):null,n=N();
   const L=v=>100*(1-Math.log10(Math.max(1,v))/Math.log10(n));
   const marks=[1000,100,10,1].filter(m=>m<n);
   let goals='';
   if(rank){const next=marks.find(m=>rank>m);const g=[];if(next&&next!==1)g.push(`<span>${fmt(next)}위 안까지 <b>${c.gap(b,D.v[next-1])}</b></span>`);if(rank>1)g.push(`<span>1위까지 <b>${c.gap(b,D.v[0])}</b></span>`);else g.push('<span><b>지금 전국 1위</b></span>');goals=g.join('')}
   else goals=`<span>지금 1위 <b>${c.fmt(D.v[0])}</b></span><span>100위 커트라인 <b>${c.fmt(D.v[99])}</b></span>`;
   const act=rank?(api.left()>0&&api.onRetry?`<button class="btn yellow sm" data-retry>다시 도전 (${api.left()}번 남음)</button>`:c.tries>1?`<span class="lb-note">오늘 공식 도전 ${c.tries}번을 다 썼어요. 0시에 다시 열려요</span>`:`<span class="lb-note">하루 한 번 도전. 내일 0시에 새 문제</span>`)
     :`<span class="lb-note">${c.tries>1?`공식 도전 하루 ${c.tries}번, 최고 기록 반영`:'하루 한 번 도전'}</span>`;
   const zc=c.perfect?bdAhead(id,0):0,nowMin=new Date().getHours()*60+new Date().getMinutes();
   const tieT=k=>{const m=Math.max(1,Math.floor((k+1)/(zc+1)*nowMin));return `${pad(Math.floor(m/60))}:${pad(m%60)}`};
   const row=(rk,nk,rg,v,me,cls='')=>`<li class="${rk<=3?'g'+rk:''} ${me?'me':''} ${cls}"><span class="n">${fmt(rk)}</span><span class="nk">${me?`${myNick()} (나)`:nickOf(nk)}${c.perfect&&v===0&&!me?`<small class="tt">${tieT(rk-1)} 기록</small>`:''}</span><span class="rg">${me?myReg():REGIONS[rg]}</span><span class="v">${c.fmt(v)}</span></li>`;
   let list='',foot='';
   if(tab==='top'){const rows=[];for(let k=0;k<10;k++)rows.push(row(k+1,D.nk[k],D.rg[k],D.v[k],false));if(rank&&rank<=10){rows.splice(rank-1,0,row(rank,0,0,b,true));rows.length=10;for(let k=rank;k<10;k++)rows[k]=row(k+1,D.nk[k-1],D.rg[k-1],D.v[k-1],false)}
    list=rows.join('')+(rank&&rank>10?`<li class="gap" aria-hidden="true">⋮</li>${row(rank,0,0,b,true)}`:'');foot=c.perfect?'1000분의 1초가 브라우저가 잴 수 있는 한계라 완벽 기록끼리는 먼저 낸 사람이 앞에 섭니다.':'같은 기록이면 먼저 낸 사람이 앞에 섭니다.'}
   else if(tab==='near'){if(!rank)list='<li class="empty">기록을 내면 내 바로 앞뒤 사람들이 보여요.</li>';else{const a=bdAhead(id,b),rows=[];for(let k=3;k>=1;k--){const i=a-k;if(i>=0)rows.push(row(rank-k,D.nk[i],D.rg[i],D.v[i],false))}rows.push(row(rank,0,0,b,true));for(let k=0;k<3;k++){const i=a+k;if(i<D.v.length)rows.push(row(rank+1+k,D.nk[i],D.rg[i],D.v[i],false))}list=(rank>4?'<li class="gap" aria-hidden="true">⋮</li>':'')+rows.join('');foot=a>0?`바로 앞 사람과 ${c.gap(b,D.v[a-1])} 차이예요.`:'아무도 내 앞에 없어요.'}}
   else if(tab==='reg'){const R2=[...D.reg].sort((x,y)=>c.low?x.avg-y.avg:y.avg-x.avg);const lo=Math.min(...R2.map(x=>x.avg)),hi=Math.max(...R2.map(x=>x.avg));
    list=R2.map((x,k)=>`<li class="rgrow ${x.n===myReg()?'me':''}"><span class="n">${k+1}</span><span class="nk">${x.n}</span><span class="bar"><i style="width:${30+70*(c.low?(hi-x.avg):(x.avg-lo))/(hi-lo||1)}%"></i></span><span class="v">${c.fmt(c.round(x.avg))}</span></li>`).join('');foot=`시도별 평균 기록. 내 기록은 ${myReg()} 평균에 들어가요.`}
   else{const wr=rng(SEED*7+id);const W=Array.from({length:10},(_,k)=>({nk:Math.floor(wr()*144),rg:pickReg(wr),p:Math.round(688-k*9-wr()*6),d:k<6?7:6}));const myP=rank?Math.round(100*(1-(rank-1)/n)):0;
    list=W.map((w,k)=>`<li class="${k<3?'g'+(k+1):''}"><span class="n">${k+1}</span><span class="nk">${nickOf(w.nk)}</span><span class="rg">${w.d}일 참여</span><span class="v">${w.p}점</span></li>`).join('')+`<li class="gap" aria-hidden="true">⋮</li><li class="me"><span class="n">-</span><span class="nk">${myNick()} (나)</span><span class="rg">오늘 1일 참여</span><span class="v">${myP}점</span></li>`;
    foot='매일 상위 몇 %였는지를 0~100점으로 바꿔 7일 동안 더합니다. 하루 1등보다 매일 오는 사람이 이기는 순위예요.'}
   el.innerHTML=`<section class="lb" aria-label="전국 순위">
    <div class="lb-top"><div><h2>오늘의 전국 순위</h2><p>${c.unit} 기준, 매일 0시에 초기화${c.perfect?`. 오늘 ±0.000초 완벽 기록 ${fmt(zc)}명, 같은 기록은 먼저 낸 순서`:''}</p></div><div class="lb-live"><i></i>참여 <b id="lbN">${fmt(n)}</b>명 <span class="mock">다른 참여자는 가상</span></div></div>
    <div class="lb-who">${editing?`<form class="lb-edit" id="lbF"><input class="inp" id="lbNick" maxlength="8" value="${myNick()}" aria-label="순위표 별명"><select class="inp" id="lbReg" aria-label="내 시도">${REGIONS.map(x=>`<option ${x===myReg()?'selected':''}>${x}</option>`).join('')}</select><button class="btn yellow sm">저장</button></form><span>순위표에 보이는 이름이에요. 실명이나 연락처는 넣지 마세요. 2~8자.</span>`
      :`<span>순위표에 <b>${myNick()}</b>, <b>${myReg()}</b>(으)로 올라가요</span><button class="linkbtn" data-edit>바꾸기</button>`}</div>
    <div class="lb-me ${rank?'':'lock'}"><div class="lb-rank ${flash?'flash':''}"><small>내 순위</small><b>${rank?fmt(rank):'?'}</b>${rank?'<em>위</em>':''}</div>
     <div class="lb-info"><div class="lb-best">${rank?`내 최고 <b>${c.fmt(b)}</b>, 상위 ${Math.max(.1,Math.round(rank/n*1000)/10)}%`:'기록을 내면 여기에 내 순위가 떠요.'}</div><div class="lb-goals">${goals}</div></div>
     <div class="lb-act">${act}</div></div>
    <div class="lb-ladder" aria-hidden="true"><div class="track"></div>${marks.map(m=>`<span class="mk" style="left:${L(m)}%">${m===1?'1위':fmt(m)+'위'}</span>`).join('')}<span class="mk" style="left:0%">${fmt(n)}위</span>${rank?`<span class="dot" style="left:${L(rank)}%">나</span>`:''}</div>
    <div class="seg-tabs lb-tabs" role="group" aria-label="순위 보기">${[['top','TOP 10'],['near','내 주변'],...(c.noRegion?[]:[['reg','시도 대항']]),['week','이번 주']].map(([k,t])=>`<button aria-pressed="${tab===k}" data-tab="${k}">${t}</button>`).join('')}</div>
    <ol class="lb-list">${list}</ol><p class="lb-foot">${foot}</p></section>`;
   flash=false;
   $$('[data-tab]',el).forEach(x=>x.onclick=()=>{tab=x.dataset.tab;api.render()});
   const ed=$('[data-edit]',el);if(ed)ed.onclick=()=>{editing=true;api.render();$('#lbNick').focus()};
   const f=$('#lbF',el);if(f)f.onsubmit=e=>{e.preventDefault();const v=$('#lbNick').value.trim();if(v.length<2){toast('별명은 2자 이상이에요');return}store.set('nick',v);store.set('reg',$('#lbReg').value);editing=false;api.render();toast('순위표 이름을 바꿨어요')};
   const rt=$('[data-retry]',el);if(rt)rt.onclick=()=>{api.onRetry&&api.onRetry();$('.machine').scrollIntoView({behavior:'smooth',block:'start'})};
  }};
 every(2400,()=>{grow+=1+Math.floor(Math.random()*3);const e=$('#lbN');if(e)e.textContent=fmt(N())});
 every(8000,()=>{const b=best();if(b==null)return;const r=rankOf(b);if(r<=1||Math.random()>.55)return;bump++;toast(`${nickOf(Math.floor(Math.random()*144))}(${REGIONS[pickReg(Math.random)]})님이 방금 앞질렀어요. ${fmt(r)}위 → ${fmt(r+1)}위`);flash=true;if(!editing)api.render()});
 return api}

/* 허브: 오늘의 1위 */
function hubChamps(){const ids=Object.keys(BOARDS).map(Number);
 return `<section class="wrap"><div class="champs">
  <div class="champs-head"><div><h2>오늘의 1위</h2><p>매일 0시에 순위가 초기화돼요. 지금 1위 기록에 도전해 보세요.</p></div><div class="champs-reset">초기화까지 <b id="rst">--:--:--</b></div></div>
  <div class="champs-grid">${ids.map(id=>{const s=SVC(id),c=BOARDS[id],D=boardData(id),b=bestOf(id);const myR=b!=null?bdAhead(id,b)+1:null;
   return `<a class="champ g-${GROUPS[s.g].color}" href="#/s/${id}"><span class="cn">${id}</span><span class="t">${s.title}</span><span class="r1">${c.fmt(D.v[0])}</span><span class="who">${nickOf(D.nk[0])}, ${REGIONS[D.rg[0]]}</span><span class="mine">${myR?`내 순위 <b>${fmt(myR)}위</b> / ${fmt(D.v.length+1)}명`:`아직 도전 전, 참여 ${fmt(D.v.length)}명`}</span></a>`}).join('')}</div></div></section>`}
function hubChampsInit(){const t=()=>{const n=new Date(),d=Math.floor((new Date(n.getFullYear(),n.getMonth(),n.getDate()+1)-n)/1000);const e=$('#rst');if(e)e.textContent=`${pad(Math.floor(d/3600))}:${pad(Math.floor(d%3600/60))}:${pad(d%60)}`};t();every(1000,t)}

$('#topDate').innerHTML=`<strong>${DATE_LABEL}</strong>, 오늘의 문제가 열려 있어요`;
document.querySelector('.logo').insertAdjacentHTML('afterbegin',LOGO);
window.addEventListener('hashchange',route);route();

</script>
